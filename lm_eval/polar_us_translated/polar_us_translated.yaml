task: polar_us_translated
dataset_path: ~/polar/dataset/polar_us_translated
dataset_name: null
output_type: multiple_choice

test_split: test
fewshot_split: test

process_docs: !function utils.process_docs
doc_to_text: "{{query}}"
doc_to_target: "{{gold}}"
doc_to_choice: "choices"

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0